# INVISIBLE! -- science-fair demo configuration.
# The operator should only ever need to touch `camera`, `ui.lang` and `patch.active`.

model:
  # The detector the children are fooling. MUST match patch.target_model below.
  name: yolov8n
  weights: assets/models/yolov8n.pt
  device: mps            # mps | cpu | cuda
  imgsz: 1280            # Drives how small a poster can be. The trigger class
                         # fires from ~100 px at 1280, ~140 px at 960, and needs
                         # a huge poster at 640. 1280 lets an A4 work out to 2 m
                         # and costs ~8 ms.
  conf: 0.4              # fixed, shown on screen
  classes: [0]           # 0 = person

expert:
  # Second, newer detector shown side by side in expert mode (`E`).
  # The patch was NOT optimised against this one, and it keeps detecting.
  enabled: true
  name: yolov10n
  weights: assets/models/yolov10n.pt

patch:
  # Which image is warped into the board in virtual mode / printed for real mode.
  # `target_model` is a hard guard: the app refuses to start if it disagrees
  # with model.name above, because a patch only fools the model it was made for.
  target_model: yolov8n
  active: adversarial
  images:
    # Two posters: the magic one and an ordinary photo of the SAME breed, so the
    # children cannot tell them apart by subject -- only the pattern differs.
    adversarial: assets/patches/magic_dog.png
    dog: assets/decoys/dog_photo.jpg

trigger:
  # What makes the box vanish.
  #   detector -- the honest one: the box goes when YOLO really loses the child.
  #               Measured ~30% of the time (see docs/PATCH_NOTES.md).
  #   neuron   -- poster A is trained to drive ONE output class hard. The box is
  #               fired by that class appearing. It is not an attack: the patch
  #               is a real, model-specific, optimised pattern, it just signals
  #               instead of evading. The decoy never fires it, and neither does
  #               a hand, a wall or an empty board -- no keypress, and it works
  #               for a printed poster as well as a warped one.
  mode: neuron            # detector | neuron  -- press S to switch live
  target_class: 78        # 'hair drier' -- never in frame at a science fair
  threshold: 0.20         # the decoy sits at 0.000 exactly, so the margin
                          # is enormous and a low bar costs nothing
  latch_frames: 12        # keep firing this many frames after the last hit. The
                          # class fires on roughly half the frames, so a short
                          # latch turns a flickering signal into a steady one --
                          # ~0.02% chance of a gap across 12 frames.
  fade_seconds: 0.35      # drain the bar over this long; an instant cut reads as fake

camera:
  index: 0               # override with --camera; never guessed automatically
  width: 1280
  height: 720
  fps: 30
  mirror: true           # display only -- the detector always sees the raw
                         # frame, or a printed patch arrives flipped (Mode A)

stability:
  # Tuned so the box does not flicker and the celebration does not misfire.
  hold_frames: 3           # keep a detection alive this many empty frames
  vanish_seconds: 0.6      # continuous non-detection before "vanished" fires
  refound_frames: 2        # frames of detection before "found you" fires
  min_box_area_frac: 0.01  # ignore specks; track only the largest person

ui:
  lang: it
  fullscreen: true
  hide_cursor: true
  font: assets/fonts/Fredoka.ttf
  show_fps: false
  # Cartoon palette (BGR, because OpenCV).
  colors:
    box: [60, 220, 255]        # amber
    box_lost: [120, 120, 120]
    accent: [255, 120, 60]     # blue-ish
    good: [80, 230, 120]
    bad: [80, 80, 240]
    panel_bg: [40, 28, 22]
    text: [255, 255, 255]

branding:
  # Each logo sits in its own corner, with no plate behind it -- so supply
  # artwork that reads on a dark background (UNICA's white variant, not the
  # black one). A missing file is skipped, it never breaks the demo.
  text: "SharperNight 2026"
  logos:
    - path: assets/logos/saiferlab.png
      pos: top-left
      height: 58
    - path: assets/logos/unica_white.png
      pos: bottom-right
      height: 50

sound:
  enabled: true
  volume: 0.8

scoreboard:
  size: 5
  min_time_seconds: 1.0    # do not record sub-second flickers

fallback:
  # Mode C: if the camera dies or the queue is long.
  video: assets/fallback/loop.mp4
  stills_dir: assets/fallback/stills
